name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # Formatting drifted unnoticed across seven files because nothing checked
      # it. gofmt has one right answer, so a gate here costs nothing and keeps
      # review diffs about behaviour rather than whitespace.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Module metadata
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # The race detector is off on the developer's Windows machine (it needs
      # cgo and a C toolchain), so CI is the only place it runs. detonate is
      # concurrent by nature — a container's stderr is written by one goroutine
      # while another reads it — and that exact pattern already produced a real
      # bug where a finding was silently lost.
      # Ubuntu runners ship with Docker, so the sandbox integration tests run
      # for real here rather than skipping. Checked before the suite so a
      # missing daemon fails in an obvious place.
      - name: Confirm Docker is available
        run: docker version

      # DETONATE_REQUIRE_DOCKER turns every Docker-gated skip into a failure.
      # Without it, an unavailable daemon makes 21 tests — every sandbox
      # invariant, including "the network is blocked" and "the target does not
      # run as root" — skip silently, and the job prints the same green as a run
      # that proved all of them. `docker version` passing does not mean the
      # tests used Docker; this does.
      - name: Test
        env:
          DETONATE_REQUIRE_DOCKER: '1'
        run: go test -race -count=1 -timeout 25m ./...

  # E5: the privileged lane that proves the eBPF monitor actually loads.
  #
  # internal/ebpf ships a COMMITTED, pre-compiled CO-RE object, embedded with
  # go:embed so `go install` needs no clang. That object was compiled against
  # one developer machine's kernel BTF (WSL2, 6.18). The claim that it relocates
  # against any kernel is the entire reason the generated vmlinux.h is not
  # committed -- and until this job existed it was an argument, not a
  # measurement, because the only machine that ever loaded it was the one that
  # built it.
  #
  # So this runs the real-kernel test on a kernel nobody chose: whatever
  # ubuntu-latest is this month. If the object stops relocating, this is what
  # says so.
  ebpf:
    name: eBPF monitor loads on a real kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # Checked before the test so a kernel without BTF fails in an obvious
      # place, naming what is missing, rather than inside a Go skip.
      - name: Confirm the kernel can support a CO-RE load
        run: |
          set -euo pipefail
          uname -a
          if [ ! -r /sys/kernel/btf/vmlinux ]; then
            echo "::error::no readable /sys/kernel/btf/vmlinux on this runner; a CO-RE load cannot be validated"
            exit 1
          fi
          echo "kernel BTF present: $(stat -c %s /sys/kernel/btf/vmlinux) bytes"

      # Built as the normal user, then run under sudo. Running `go test`
      # directly as root would populate the Go build cache with root-owned
      # entries and break later cached steps; compiling first keeps privilege
      # confined to the thing that actually needs it -- loading the program.
      #
      # DETONATE_REQUIRE_EBPF is passed on the sudo command line rather than
      # relying on -E, because sudoers resets the environment by default and a
      # silently dropped variable would turn this job back into one that passes
      # by skipping.
      - name: Load the embedded object and attach both tracepoints
        run: |
          set -euo pipefail
          go test -c -o "${RUNNER_TEMP}/ebpf.test" ./internal/ebpf
          sudo DETONATE_REQUIRE_EBPF=1 "${RUNNER_TEMP}/ebpf.test" -test.run 'TestMonitorLoadsAndAttachesOnRealKernel|TestCloseIsIdempotent' -test.v

      # The additive contract, checked on the same runner: without privilege
      # the monitor must degrade to a no-op and the package must still pass.
      # An eBPF monitor that becomes a hard dependency is a regression even
      # when it works.
      - name: Unprivileged run still passes and degrades to no-op
        run: go test -count=1 ./internal/ebpf

  # A normal checkout is already clean on GitHub, but extracting git archive
  # makes the invariant explicit: ignored and untracked developer files cannot
  # make this job pass. This caught cmd/detonate/main.go being present locally
  # while absent from the repository.
  clean-checkout:
    name: Clean checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extension: ''
          - os: macos-latest
            extension: ''
          - os: windows-latest
            extension: '.exe'

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: source/go.sum

      - name: Export tracked source
        shell: pwsh
        run: |
          git -C source ls-files --error-unmatch cmd/detonate/main.go
          if ($LASTEXITCODE -ne 0) {
            throw "cmd/detonate/main.go is not tracked"
          }

          $archive = Join-Path $env:RUNNER_TEMP "detonate-source.tar"
          $clean = Join-Path $env:RUNNER_TEMP "detonate-clean"
          git -C source archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "git archive failed"
          }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          tar -xf $archive -C $clean
          if ($LASTEXITCODE -ne 0) {
            throw "extracting the tracked source archive failed"
          }

      - name: Build, install, and smoke test tracked source
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "detonate-clean"
          $binary = Join-Path $env:RUNNER_TEMP "detonate${{ matrix.extension }}"
          $installDir = Join-Path $env:RUNNER_TEMP "detonate-install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Push-Location $clean
          try {
            go build -trimpath -o $binary ./cmd/detonate
            if ($LASTEXITCODE -ne 0) {
              throw "go build failed"
            }

            $env:GOBIN = $installDir
            go install ./cmd/detonate
            if ($LASTEXITCODE -ne 0) {
              throw "go install failed"
            }

            $version = & $binary --version
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '^detonate \S+$') {
              throw "version smoke test failed: $version"
            }

            $json = "Summarize the user's text clearly." |
              & $binary - --format json
            if ($LASTEXITCODE -ne 0) {
              throw "prompt smoke test failed with exit code $LASTEXITCODE"
            }
            $report = $json | ConvertFrom-Json
            if ($report.schema -ne "detonate.report/v1" -or
                $report.tool -ne "detonate") {
              throw "prompt smoke test returned an invalid report"
            }
          }
          finally {
            Pop-Location
          }
