name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Formatting drifted unnoticed across seven files because nothing checked
      # it. gofmt has one right answer, so a gate here costs nothing and keeps
      # review diffs about behaviour rather than whitespace.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector is off on the developer's Windows machine (it needs
      # cgo and a C toolchain), so CI is the only place it runs. detonate is
      # concurrent by nature — a container's stderr is written by one goroutine
      # while another reads it — and that exact pattern already produced a real
      # bug where a finding was silently lost.
      - name: Test
        run: go test -race -count=1 -timeout 25m ./...

      # Ubuntu runners ship with Docker, so the sandbox integration tests run
      # for real here rather than skipping.
      - name: Confirm Docker was available
        run: docker version

  # A normal checkout is already clean on GitHub, but extracting git archive
  # makes the invariant explicit: ignored and untracked developer files cannot
  # make this job pass. This caught cmd/detonate/main.go being present locally
  # while absent from the repository.
  clean-checkout:
    name: Clean checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extension: ''
          - os: macos-latest
            extension: ''
          - os: windows-latest
            extension: '.exe'

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: source/go.sum

      - name: Export tracked source
        shell: pwsh
        run: |
          git -C source ls-files --error-unmatch cmd/detonate/main.go
          if ($LASTEXITCODE -ne 0) {
            throw "cmd/detonate/main.go is not tracked"
          }

          $archive = Join-Path $env:RUNNER_TEMP "detonate-source.tar"
          $clean = Join-Path $env:RUNNER_TEMP "detonate-clean"
          git -C source archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "git archive failed"
          }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          tar -xf $archive -C $clean
          if ($LASTEXITCODE -ne 0) {
            throw "extracting the tracked source archive failed"
          }

      - name: Build, install, and smoke test tracked source
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "detonate-clean"
          $binary = Join-Path $env:RUNNER_TEMP "detonate${{ matrix.extension }}"
          $installDir = Join-Path $env:RUNNER_TEMP "detonate-install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Push-Location $clean
          try {
            go build -trimpath -o $binary ./cmd/detonate
            if ($LASTEXITCODE -ne 0) {
              throw "go build failed"
            }

            $env:GOBIN = $installDir
            go install ./cmd/detonate
            if ($LASTEXITCODE -ne 0) {
              throw "go install failed"
            }

            $version = & $binary --version
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '^detonate \S+$') {
              throw "version smoke test failed: $version"
            }

            $json = "Summarize the user's text clearly." |
              & $binary - --format json
            if ($LASTEXITCODE -ne 0) {
              throw "prompt smoke test failed with exit code $LASTEXITCODE"
            }
            $report = $json | ConvertFrom-Json
            if ($report.schema -ne "detonate.report/v1" -or
                $report.tool -ne "detonate") {
              throw "prompt smoke test returned an invalid report"
            }
          }
          finally {
            Pop-Location
          }
