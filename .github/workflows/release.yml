name: Release

on:
  push:
    tags:
      # Full versions only. The floating major tag (v0) is moved onto each
      # release so `uses: m4vic/detonate@v0` keeps working, and it is pushed as
      # a tag like any other — under 'v*' that second push would run GoReleaser
      # again and publish a duplicate release named "v0".
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  # A tag must not publish binaries that the main CI would have rejected. The
  # tag-push event does not trigger the CI workflow, so the same gates run here
  # and GoReleaser depends on them. Before this job existed, any v* tag ran
  # GoReleaser immediately with no test, format, or clean-checkout gate — which
  # directly contradicted the CHANGELOG's claim that release publication depends
  # on them. This job is what makes that claim true.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Tracked entrypoint
        run: git ls-files --error-unmatch cmd/detonate/main.go

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Confirm Docker is available
        run: docker version

      # See ci.yml: without this, an unavailable daemon skips every sandbox
      # invariant and the release gate passes having proved none of them.
      - name: Test (race)
        env:
          DETONATE_REQUIRE_DOCKER: '1'
        run: go test -race -count=1 -timeout 25m ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
