schema: detonate.corpus/v1
fixture: evil-mcp-encoding
kind: mcp
command: python /target/server.py

# The general boundary (enc.*, six tools): the same planted secret, ~/.netrc,
# read and transformed six ways. Only enc.gzip-b64 remains a known_gap —
# plain/hex/reversed/rot13/spaced are all caught. known_gap flags are set from
# the actual run, not from a guess — see testdata/corpus/README.md.
#
# The SSH-decoy boundary (enc.ssh-*, three tools): a second, narrower question
# — is the *derived* value a decoy stores (base64(token), not the raw token)
# equally robust to the same transforms? It is, as of the fix that added
# derivedEncodings() in internal/decoy.
planted:
  - id: enc.plain
    class: credential-exfiltration
    where: 'read_plain returns the netrc verbatim'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_plain" returned the contents'

  - id: enc.hex
    class: credential-exfiltration-encoded
    where: 'read_hex returns hex(netrc)'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_hex" returned the contents'

  # Closed: the matcher now checks a reversed encoding of the token.
  - id: enc.reversed
    class: credential-exfiltration-obfuscated
    where: 'read_reversed returns the secret reversed'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_reversed" returned the contents'

  # Closed: the matcher now checks a rot13 encoding of the token.
  - id: enc.rot13
    class: credential-exfiltration-obfuscated
    where: 'read_rot13 returns rot13(secret)'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_rot13" returned the contents'

  # Still a gap: catching this means gunzip-ing base64 blobs in the output, not
  # just adding one more static encoding of the token.
  - id: enc.gzip-b64
    class: credential-exfiltration-obfuscated
    where: 'read_gzip_b64 returns base64(gzip(secret))'
    expect: finding
    known_gap: true
    match:
      source: decoy
      summary_contains: '"read_gzip_b64" returned the contents'

  # Closed: the matcher now also scans a whitespace-stripped view of the output.
  - id: enc.spaced
    class: credential-exfiltration-obfuscated
    where: 'read_spaced puts a space between every character'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_spaced" returned the contents'

  # Closed: "the SSH-key decoy is base64-only". Its file holds base64(token),
  # not the raw token, so hex-of-file used to produce hex(base64(token)) — an
  # encoding of no value the matcher checked. derivedEncodings() in
  # internal/decoy now also checks transforms of base64(token) for this decoy
  # specifically, and these three tools prove it under the real pipeline.
  - id: enc.ssh-hex
    class: credential-exfiltration-ssh-decoy
    where: 'read_ssh_hex returns hex(id_rsa contents)'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_ssh_hex" returned the contents'

  - id: enc.ssh-reversed
    class: credential-exfiltration-ssh-decoy
    where: 'read_ssh_reversed returns id_rsa contents reversed'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_ssh_reversed" returned the contents'

  - id: enc.ssh-rot13
    class: credential-exfiltration-ssh-decoy
    where: 'read_ssh_rot13 returns rot13(id_rsa contents)'
    expect: finding
    match:
      source: decoy
      summary_contains: '"read_ssh_rot13" returned the contents'
