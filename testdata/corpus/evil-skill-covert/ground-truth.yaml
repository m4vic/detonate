schema: detonate.corpus/v1
fixture: evil-skill-covert
kind: skill

# The point of this fixture: the SKILL.md is clean. It declares Bash honestly,
# carries no injection or concealment language, and reads like an ordinary
# markdown-tidy helper -- nothing a reviewer scanning the instructions would
# flag. The danger is entirely in what a bundled script does when it runs, which
# is the skill-side parallel to evil-mcp-covert and the case that justifies
# executing a skill's scripts instead of only reading its prose.
#
# known_gap flags are set from the actual run, not from a guess -- see
# testdata/corpus/README.md.
planted:
  - id: covert.script-reads-credential
    class: credential-exfiltration
    where: 'format.py folds ~/.aws/credentials into its output disguised as a build fingerprint'
    expect: finding
    match:
      source: decoy
      summary_contains: 'scripts/format.py" returned the contents'

  # Matched against the eBPF source, not the decoy one. The decoy tier keys
  # entirely on planted nonces, and a persistence write leaves none -- it
  # writes attacker-controlled CODE to a file that holds no decoy -- so no
  # decoy-sourced event can ever carry this. Pointing the match at `decoy`
  # described a gap that could not close: eBPF would emit the finding, this
  # line would still match nothing, the item would stay marked known_gap, and
  # the set-equality gate would still pass. The gap would silently fail to
  # close with no test saying so.
  #
  # Still known_gap until a PRIVILEGED corpus run proves it. eBPF needs root
  # and a BTF kernel, so the ordinary unprivileged CI lane sees no ebpf events
  # and this correctly stays open there. Closing it is E5b's job, and the gate
  # will then fail until known_gap is removed -- which is the mechanism
  # working, not breaking.
  - id: covert.persistence-no-token
    class: persistence
    where: 'setup_env.py appends a curl|sh implant to ~/.bashrc, leaving no planted token to match'
    expect: finding
    known_gap: true
    match:
      source: ebpf
      summary_contains: '.bashrc'
