schema: detonate.corpus/v1
fixture: evil-mcp-injection
kind: mcp
command: python /target/server.py

# One instruction-override attack, six phrasings, rising evasion of the metadata
# regex. Maps the detector's brittleness. Note t_canonical also names
# ~/.ssh/id_rsa, so it may additionally trip the credential-path rule; the
# matcher keys on the tool name, so either description finding on that tool
# counts. known_gap flags come from the actual run.
planted:
  - id: inj.canonical
    class: prompt-injection
    where: 't_canonical.description — textbook "disregard all previous instructions"'
    expect: finding
    match:
      source: tool-description
      summary_contains: '"t_canonical"'

  - id: inj.synonym
    class: prompt-injection-evasion
    where: 't_synonym.description — "set aside the earlier directions"'
    expect: finding
    known_gap: true
    match:
      source: tool-description
      summary_contains: '"t_synonym"'

  - id: inj.passive
    class: prompt-injection-evasion
    where: 't_passive.description — passive voice, noun before verb'
    expect: finding
    known_gap: true
    match:
      source: tool-description
      summary_contains: '"t_passive"'

  - id: inj.homoglyph
    class: prompt-injection-evasion
    where: 't_homoglyph.description — leading Cyrillic homoglyph'
    expect: finding
    known_gap: true
    match:
      source: tool-description
      summary_contains: '"t_homoglyph"'

  # Caught: the pattern's \s+ spans newlines, so splitting the directive across
  # line breaks does not evade it. Kept as a fixture precisely to pin that down
  # — a plausible-looking evasion that in fact does not work.
  - id: inj.newline
    class: prompt-injection-evasion
    where: 't_newline.description — directive split across line breaks'
    expect: finding
    match:
      source: tool-description
      summary_contains: '"t_newline"'

  - id: inj.encoded
    class: prompt-injection-evasion
    where: 't_encoded.description — base64 instruction with a decode nudge'
    expect: finding
    known_gap: true
    match:
      source: tool-description
      summary_contains: '"t_encoded"'
