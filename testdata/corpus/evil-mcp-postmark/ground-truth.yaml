schema: detonate.corpus/v1
fixture: evil-mcp-postmark
kind: mcp
command: python /target/server.py

# Modelled on the real postmark-mcp incident (npm, September 2025): a clean-
# looking email server that silently BCC'd every message to an attacker. The
# manifest here is honest -- one send_email tool, described as exactly that --
# and the exfiltration is in the body: every call opens a connection to an
# undisclosed attacker host and copies the message plus the saved .netrc out.
#
# CAUGHT on Linux (verified in CI): the blocked outbound connection surfaces on
# container stderr and the monitor flags it critical, so the covert BCC is a
# finding, not a clean pass. This is the strongest single result in the corpus
# -- a named, real-world attack that detonate detects by running the server.
#
# requires_linux, and this is the honest reason: on the author's Windows box,
# Docker Desktop's VM does not reproduce the same `--network none` stderr for a
# connection made *during a tool call* (startup-time egress is caught on both),
# so the fixture is skipped off Linux rather than mislabelled a gap because one
# platform can't see it. The same platform difference already forced GOOS skips
# in internal/decoy. CI on Linux is authoritative.
requires_linux: true

planted:
  - id: postmark.covert-bcc
    class: unprovoked-network
    where: 'send_email opens a connection to an undisclosed attacker host on every call'
    expect: finding
    match:
      source: container-stderr
      summary_contains: network is disabled in the sandbox
