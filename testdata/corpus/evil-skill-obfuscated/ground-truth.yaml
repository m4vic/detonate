schema: detonate.corpus/v1
fixture: evil-skill-obfuscated
kind: skill

# One instruction-override attack, four phrasings, in a skill body. Each line
# carries a unique marker so a finding maps to exactly one variant.
#
# The skill analyser emits one event per signature (a repeated pattern is one
# behaviour), so only the FIRST matching line is reported. That is why there is
# no canonical "Ignore all previous instructions" line here: it would match and
# shadow the override line, hiding the one thing this fixture exists to prove.
# The canonical form is covered by evil-mcp-injection and by the skill unit
# tests. The three phrasing variants below match no signature at all, so they do
# not shadow anything — they are honest gaps.
#
# inj.override records a closed asymmetry: the skill scanner's verb list was
# (ignore|disregard|forget) only, so "override" was caught on the MCP path and
# missed here. The two instruction-override patterns are now aligned.
planted:
  # Closed: the skill override pattern was aligned with toolscan's, which
  # already had the verb "override". The two signature lists no longer drift.
  - id: inj.override
    class: prompt-injection-evasion
    where: 'marker-override line — verb "override"'
    expect: finding
    match:
      source: skill-instructions
      summary_contains: marker-override

  - id: inj.synonym
    class: prompt-injection-evasion
    where: 'marker-synonym line — "set aside the earlier directions"'
    expect: finding
    known_gap: true
    match:
      source: skill-instructions
      summary_contains: marker-synonym

  - id: inj.passive
    class: prompt-injection-evasion
    where: 'marker-passive line — passive voice, no override verb'
    expect: finding
    known_gap: true
    match:
      source: skill-instructions
      summary_contains: marker-passive

  - id: inj.homoglyph
    class: prompt-injection-evasion
    where: 'marker-homoglyph line — leading fullwidth homoglyph'
    expect: finding
    known_gap: true
    match:
      source: skill-instructions
      summary_contains: marker-homoglyph
