[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detonate"
version = "0.0.1"
description = "Detonate untrusted MCP servers in a sandbox and report what they actually do."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "m4vic", email = "sanskarmaheshwari062@gmail.com" }]
keywords = ["mcp", "security", "sandbox", "ai-security", "scanner", "supply-chain"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

# Deps are added by the exact milestone that first needs them, so nobody
# installs something unused. M0 needed none (the Docker check shells out to the
# CLI). M1 needs two: the official MCP SDK to speak the protocol to a server,
# and PyYAML to read a SKILL.md's frontmatter. docker-py arrives with M2, when
# we actually orchestrate containers instead of just checking for them.
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
detonate = "detonate.cli:main"

[project.urls]
Homepage = "https://github.com/m4vic/detonate"

[tool.hatch.build.targets.wheel]
packages = ["src/detonate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
